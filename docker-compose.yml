version: "3.8"

services:
  vapviz:
    build: .
    ports:
      - "8001:8001"   # API + UI on the same port
    volumes:
      - vapviz-data:/data        # SQLite database persists across restarts
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/runs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vapviz-data:
    driver: local
