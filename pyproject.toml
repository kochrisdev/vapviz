[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vapviz"
version = "1.1.0"
description = "Visualization Agentic Process — trace and visualize AI agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kochrisdev", email = "christophertun.dev@gmail.com" }]
keywords = [
    "agent",
    "tracing",
    "observability",
    "llm",
    "visualization",
    "crewai",
    "langchain",
    "pydantic-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sse-starlette>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/kochrisdev/vapviz"
Repository = "https://github.com/kochrisdev/vapviz"
Documentation = "https://github.com/kochrisdev/vapviz/tree/main/docs"
Issues = "https://github.com/kochrisdev/vapviz/issues"
Changelog = "https://github.com/kochrisdev/vapviz/blob/main/docs/DEVELOPER_REFERENCE.md#changelog"

[project.optional-dependencies]
anthropic   = ["anthropic>=0.28.0"]
openai      = ["openai>=1.0.0"]
langchain   = ["langchain-core>=0.1.0"]
crewai      = ["crewai>=1.0.0"]
pydantic-ai = ["pydantic-ai-slim>=1.0.0"]
otel        = ["opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp>=1.20.0"]
llamaindex  = ["llama-index-core>=0.11.0"]
autogen     = ["ag2>=0.4"]
all         = ["anthropic>=0.28.0", "openai>=1.0.0", "langchain-core>=0.1.0", "crewai>=1.0.0", "pydantic-ai-slim>=1.0.0", "opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp>=1.20.0", "llama-index-core>=0.11.0", "ag2>=0.4"]
dev         = ["pytest", "httpx", "pytest-asyncio", "anthropic>=0.28.0", "openai>=1.0.0", "langchain-core>=0.1.0", "pydantic-ai-slim>=1.0.0", "opentelemetry-sdk>=1.20.0", "llama-index-core>=0.11.0"]
# Everything the real-LLM integration tests (tests/test_*_integration.py) import,
# so CI can run them. They still skip cleanly without OPENROUTER_API_KEY (and
# ANTHROPIC_API_KEY for the Anthropic test).
test        = ["pytest", "httpx", "pytest-asyncio", "openai>=1.0.0", "anthropic>=0.28.0", "langchain-openai>=0.1.0", "langgraph>=0.2.0", "crewai>=1.0.0", "pydantic-ai-slim>=1.0.0", "llama-index-core>=0.11.0", "llama-index-llms-openai>=0.2.0", "ag2>=0.4"]

[project.scripts]
vapviz = "vapviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vapviz"]

# The built React UI is bundled as package data under `vapviz/_static` (so
# `pip install vapviz && vapviz serve` serves it with no Node build). CI/release
# build the UI and copy it into `vapviz/_static` before packaging. These globs
# include it when present and are simply empty otherwise — so a plain editable
# install (e.g. CI's test job) does NOT require the UI to be built.
artifacts = ["vapviz/_static/**/*"]

[tool.hatch.build.targets.sdist]
artifacts = ["vapviz/_static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
