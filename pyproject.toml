[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vap"
version = "0.6.0"
description = "Visualization Agentic Process — trace and visualize AI agent workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.28.0"]
openai    = ["openai>=1.0.0"]
langchain = ["langchain-core>=0.1.0"]
crewai    = ["crewai>=1.0.0"]
all       = ["anthropic>=0.28.0", "openai>=1.0.0", "langchain-core>=0.1.0", "crewai>=1.0.0"]
dev       = ["pytest", "httpx", "pytest-asyncio", "anthropic>=0.28.0", "openai>=1.0.0", "langchain-core>=0.1.0"]

[project.scripts]
vap = "vap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vap"]
